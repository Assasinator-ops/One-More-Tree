<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image audit</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  figure { margin: 0; }
  img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; background: #eee; display: block; }
  figcaption { font-weight: 600; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>Theme bundled imagery</h1>
<div class="grid" id="g"></div>
<script>
const base = 'http://localhost:8888/wp-content/themes/lennox/assets/images/';
const files = ['hero1.jpg','about1.jpg','about2.jpg','service1.jpg','service2.jpg','service3.jpg','service4.jpg','case-study1.jpg','case-study2.jpg','case-study3.jpg','testimonial-avatar1.jpg','testimonial-avatar2.jpg','hero-avatar1.jpg','hero-avatar2.jpg','hero-avatar3.jpg','hero-avatar4.jpg'];
const g = document.getElementById('g');
files.forEach(f => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<img src="${base}${f}" alt=""><figcaption>${f}</figcaption>`;
  g.appendChild(fig);
});
const fig = document.createElement('figure');
fig.innerHTML = `<img src="http://localhost:8888/wp-content/uploads/2026/10/ChatGPT-Image-Sep-5-2026-06_39_04-AM.png" alt=""><figcaption>uploads: ChatGPT-Image…</figcaption>`;
g.appendChild(fig);
</script>
</body>
</html>
